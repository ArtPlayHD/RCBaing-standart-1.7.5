<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Напоминания и сообщения</title>
  <style>
    body {
      background: #121212;
      color: #e0e0e0;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .reminder-widget {
      max-width: 500px;
      margin: 0 auto;
      padding: 24px;
      border-radius: 12px;
      background: #1e1e1e;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h3 {
      margin-top: 0;
      text-align: center;
      color: #fff;
    }

    select, textarea, input[type="text"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #444;
      border-radius: 6px;
      background: #2b2b2b;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
    }

    select:focus, textarea:focus, input:focus {
      outline: none;
      border-color: #6c5ce7;
      box-shadow: 0 0 8px rgba(108, 92, 231, 0.4);
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .actions, .send-message {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #3a3a3a;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background: #555;
    }

    button.primary {
      background: #6c5ce7;
    }

    button.primary:hover {
      background: #5649b8;
    }

    .status {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="reminder-widget">
    <h3>Напоминания</h3>

    <div class="controls">
      <label for="reminder-select">Выбери напоминание:</label>
      <select id="reminder-select">
        <option value="WR1">Напоминание A</option>
        <option value="WR2">Напоминание B</option>
        <option value="WR3">Напоминание C</option>
      </select>
    </div>

    <textarea id="reminder-text" placeholder="Введи текст напоминания..."></textarea>

    <div class="actions">
      <button id="save-reminder" class="primary">Сохранить</button>
      <button id="load-reminder">Загрузить</button>
    </div>

    <div class="status" id="status-msg"></div>
  </div>

  <hr style="border: 0; border-top: 1px solid #333; margin: 30px 0;">

  <div class="reminder-widget">
    <h3>Сообщения между страницами</h3>
    <p style="font-size:13px; color:#aaa; text-align:center;">Работает на разных вкладках этого сайта (одного домена)</p>

    <input type="text" id="message-text" placeholder="Сообщение для других страниц">
    <div class="send-message">
      <button id="send-message-btn" class="primary">Отправить всем</button>
    </div>

    <div class="status" id="broadcast-status"></div>
    <div style="margin-top:12px; padding:10px; background:#2b2b2b; border-radius:6px; font-size:13px;">
      Последние полученные сообщения:<br>
      <div id="received-messages" style="max-height:150px; overflow-y:auto; color:#ccc;"></div>
    </div>
  </div>

  <script>
    // --- Напоминания (localStorage) ---
    const reminderSelect = document.getElementById('reminder-select');
    const reminderText = document.getElementById('reminder-text');
    const saveBtn = document.getElementById('save-reminder');
    const loadBtn = document.getElementById('load-reminder');
    const statusMsg = document.getElementById('status-msg');

    function showStatus(text, isError = false) {
      statusMsg.textContent = text;
      statusMsg.style.color = isError ? '#ff6b6b' : '#6bcb72';
      setTimeout(() => statusMsg.textContent = '', 3000);
    }

    saveBtn.addEventListener('click', () => {
      const key = reminderSelect.value;
      const value = reminderText.value.trim();
      if (!value) {
        showStatus('Текст не может быть пустым', true);
        return;
      }
      localStorage.setItem(key, value);
      showStatus('Сохранено!');
    });

    loadBtn.addEventListener('click', () => {
      const key = reminderSelect.value;
      const value = localStorage.getItem(key);
      if (value === null) {
        reminderText.value = '';
        showStatus('Нет сохранённого текста для этого напоминания', true);
      } else {
        reminderText.value = value;
        showStatus('Загружено!');
      }
    });


    // --- Сообщения между вкладками (BroadcastChannel) ---
    const messageText = document.getElementById('message-text');
    const sendMessageBtn = document.getElementById('send-message-btn');
    const broadcastStatus = document.getElementById('broadcast-status');
    const receivedMessages = document.getElementById('received-messages');

    const channel = new BroadcastChannel('rcb-broadcast-channel');

    channel.onmessage = (event) => {
      const msg = document.createElement('div');
      msg.textContent = event.data;
      msg.style.marginBottom = '6px';
      receivedMessages.prepend(msg);
      broadcastStatus.textContent = 'Получено новое сообщение';
      broadcastStatus.style.color = '#6bcb72';
      setTimeout(() => broadcastStatus.textContent = '', 3000);
    };

    sendMessageBtn.addEventListener('click', () => {
      const text = messageText.value.trim();
      if (!text) {
        broadcastStatus.textContent = 'Введите сообщение';
        broadcastStatus.style.color = '#ff6b6b';
        setTimeout(() => broadcastStatus.textContent = '', 3000);
        return;
      }
      channel.postMessage(text);
      messageText.value = '';
      broadcastStatus.textContent = 'Отправлено всем вкладкам';
      broadcastStatus.style.color = '#6bcb72';
      setTimeout(() => broadcastStatus.textContent = '', 3000);
    });
  </script>
</body>
</html>
