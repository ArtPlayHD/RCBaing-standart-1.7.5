<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #ff6b81;
      --text: #ffffff;
      --muted: #a0a0b0;
      --glass: rgba(255, 255, 255, 0.08);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 32px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
    }

    h1, h4 {
      text-align: center;
      color: var(--text);
    }

    .author-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .author-block:hover {
      opacity: 0.8;
    }
    .author-block img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--accent);
    }
    .author-block p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    img[alt="Обложка RCBaing"] {
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      margin: 24px 0;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .main-buttons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover:not(:disabled) {
      background: var(--glass);
      transform: translateY(-2px);
      border-color: var(--accent);
      color: var(--accent);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(1);
    }

    /* Поиск */
    .search-section {
      margin-top: 32px;
      text-align: center;
    }
    .search-input {
      padding: 10px 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      width: 280px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
    }

    .search-highlight {
      background: var(--accent);
      color: #000;
      padding: 0 4px;
      border-radius: 4px;
    }

    /* Модальное окно для админа */
    #adminModal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      width: 300px;
    }
    .modal-input {
      width: 100%;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: white;
      margin: 12px 0;
    }
    .modal-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .modal-close {
      color: var(--muted);
      cursor: pointer;
      margin-top: 12px;
      font-size: 0.9rem;
    }
  </style>
  </head>
  <body>
    <h1>Главная страница</h1>

    <div class="main-buttons-grid">
      <button onclick="window.location.href='index.html'">RCBaing</button>
      <button onclick="window.location.href='https://ya.ru/?clid=11821189&win=723'">Yandex</button>
    </div>
  </body>
</html>
