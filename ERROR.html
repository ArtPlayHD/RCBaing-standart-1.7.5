<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка</title>
    <style>
        :root {
            --bg: #1a1a2e; --card: #16213e; --input: #0f3460;
            --text: #e0e0e0; --muted: #8892b0; --accent: #e94560;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif; line-height: 1.7;
            max-width: 750px; margin: 40px auto; padding: 0 20px;
            color: var(--text); background: var(--bg); min-height: 100vh;
        }
        h1 {
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            padding-bottom: 12px;
        }
        p { margin-bottom: 1.2em; }
        .download-btn {
            display: inline-block; margin-top: 25px; padding: 12px 24px;
            background: #2ecc71; color: white; text-decoration: none;
            border-radius: 6px; font-size: 16px; transition: background 0.2s;
        }
        .download-btn:hover { background: #27ae60; }
        .back-link {
            display: inline-block; margin-top: 15px; padding: 10px 18px;
            background: var(--input); color: var(--text); text-decoration: none;
            border-radius: 6px; font-size: 14px;
        }
        .back-link:hover { background: #1a4a7a; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">&larr; Вернуться в библиотеку</a>
    <h1>Ошибка</h1>
    <p>Ничего нет</p>
    <a href="ERROR.rtf" download class="download-btn">Скачать как .rtf</a>
</body>
</html>
