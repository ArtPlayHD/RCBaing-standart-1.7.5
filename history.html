<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вы искали</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --bg-card: #16213e;
            --bg-input: #0f3460;
            --border: #0f3460;
            --text: #e0e0e0;
            --text-muted: #8892b0;
            --accent: #e94560;
            --accent-hover: #ff6b81;
            --success: #2ecc71;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            margin: 0;
        }
        header h1 {
            text-align: center;
            color: var(--accent);
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 18px;
            background: var(--bg-input);
            color: var(--text);
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s;
        }
        .back-link:hover { background: #1a4a7a; }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .toolbar button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background: var(--accent);
            color: white;
            transition: all 0.2s;
        }
        .toolbar button:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.4);
        }
        .history-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .history-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            border-left: 3px solid var(--accent);
        }
        .history-item.found { border-left-color: var(--success); }
        .history-item .query-text {
            font-size: 16px;
            font-weight: bold;
            color: var(--text);
        }
        .history-item .meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .history-item .status-found {
            color: var(--success);
            font-weight: bold;
        }
        .history-item .status-not-found {
            color: var(--accent);
            font-weight: bold;
        }
        .empty-msg {
            text-align: center;
            color: var(--text-muted);
            font-size: 16px;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <a href="BDF.html" class="back-link">&larr; Вернуться в библиотеку</a>
    <header>
        <h1>🔍 Вы искали</h1>
    </header>
    <div class="toolbar">
        <span style="color:var(--text-muted); font-size:14px;">История ваших поисковых запросов</span>
        <button onclick="clearHistory()">Очистить историю</button>
    </div>
    <div id="historyList" class="history-list"></div>
    <p id="emptyMsg" class="empty-msg" style="display:none;">Вы ещё ничего не искали. Вернитесь в библиотеку и попробуйте найти книгу!</p>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDateTime(timestamp) {
            const d = new Date(timestamp);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const hours = String(d.getHours()).padStart(2, '0');
            const mins = String(d.getMinutes()).padStart(2, '0');
            return `${day}.${month}.${year} в ${hours}:${mins}`;
        }

        function getHistory() {
            return JSON.parse(localStorage.getItem('search_history') || '[]');
        }

        function getBooks() {
            const stored = localStorage.getItem('library_books');
            return stored ? JSON.parse(stored) : [];
        }

        function render() {
            const history = getHistory();
            const books = getBooks();
            const list = document.getElementById('historyList');
            const emptyMsg = document.getElementById('emptyMsg');

            if (history.length === 0) {
                list.innerHTML = '';
                emptyMsg.style.display = 'block';
                return;
            }

            emptyMsg.style.display = 'none';
            list.innerHTML = '';

            // Новые запросы — сверху
            const reversed = [...history].reverse();

            reversed.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item' + (item.found ? ' found' : '');

                const statusText = item.found
                    ? `<span class="status-found">✓ Найдено: ${escapeHtml(item.foundTitle)}</span>`
                    : `<span class="status-not-found">✗ Не найдено</span>`;

                div.innerHTML = `
                    <div>
                        <div class="query-text">"${escapeHtml(item.query)}"</div>
                        <div class="meta">${formatDateTime(item.timestamp)}</div>
                    </div>
                    <div>${statusText}</div>
                `;

                // Если книга найдена — клик открывает её
                if (item.found) {
                    const book = books.find(b => b.title === item.foundTitle);
                    if (book && book.file) {
                        div.style.cursor = 'pointer';
                        div.addEventListener('click', () => {
                            window.location.href = book.file;
                        });
                    }
                }

                list.appendChild(div);
            });
        }

        function clearHistory() {
            if (!confirm('Очистить всю историю поиска?')) return;
            localStorage.removeItem('search_history');
            render();
        }

        render();
    </script>
</body>
</html>
